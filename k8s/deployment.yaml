apiVersion: apps/v1
kind: Deployment
metadata:
  name: fam-app-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fam-app-be
  template:
    metadata:
      labels:
        app: fam-app-be
    spec:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: fam-app-be
          image: 249746593217.dkr.ecr.us-east-1.amazonaws.com/fam-app-be:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fam-app-secrets
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
